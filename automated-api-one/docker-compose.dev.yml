version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: trading-postgres-dev
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: trading_platform
    ports:
      - "5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: trading-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  egress-proxy:
    build:
      context: ../egress-proxy
      dockerfile: Dockerfile
    container_name: trading-egress-proxy-dev
    environment:
      - NODE_ENV=development
      - PROXY_DATA_PORT=8888
      - PROXY_CONTROL_PORT=8889
      - PROXY_CONTROL_SECRET=s8_egress_super_secret_control_key_2026
      - ALLOW_DEV_FALLBACK_IP=true
    ports:
      - "8888:8888"
      - "8889:8889"

  egress-manager:
    build:
      context: ../egress-manager
      dockerfile: Dockerfile
    container_name: trading-egress-manager-dev
    environment:
      - NODE_ENV=development
      - EGRESS_MANAGER_PORT=8080
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/trading_platform?schema=public
      - EGRESS_PROXY_CONTROL_URL=http://egress-proxy:8889
      - EGRESS_PROXY_DATA_HOST=egress-proxy
      - EGRESS_PROXY_DATA_PORT=8888
      - PROXY_CONTROL_SECRET=s8_egress_super_secret_control_key_2026
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      egress-proxy:
        condition: service_started

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trading-api-dev
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/trading_platform?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=super_secret_jwt_key_that_is_at_least_eight_chars
      - PORT=3000
      - NODE_ENV=development
      - EGRESS_MANAGER_URL=http://egress-manager:8080
      - EGRESS_PROXY_HOST=egress-proxy
      - EGRESS_PROXY_PORT=8888
      - PROXY_CONTROL_SECRET=s8_egress_super_secret_control_key_2026
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      egress-manager:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_dev_data:
  redis_dev_data:
