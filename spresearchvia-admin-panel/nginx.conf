server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/wasm
        image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ensure index.html, main.dart.js, and bootstrap files are NEVER cached
    location ~* (index\.html|main\.dart\.js|flutter_service_worker\.js|flutter_bootstrap\.js|version\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        expires -1;
    }

    # Handle WebAssembly MIME type properly
    location ~* \.wasm$ {
        default_type application/wasm;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Static assets caching (images, fonts, media)
    location ~* \.(?:ico|css|gif|jpe?g|png|woff2?|eot|ttf|svg|mp4|webm)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # SPA routing fallback for Flutter Web
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Custom 404/50x error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
