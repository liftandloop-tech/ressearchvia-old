<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Admin Panel for SPRESEARCHVIA">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="spresearch_web">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SPRESEARCHVIA | Admin Portal</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0d1b2a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    #sp-preloader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: radial-gradient(circle at 50% 40%, #152642 0%, #0a1120 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      opacity: 1;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }
    #sp-preloader.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    .sp-loader-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
      max-width: 440px;
    }
    .sp-logo-wrap {
      width: 80px;
      height: 80px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 20px rgba(17, 65, 107, 0.4);
      animation: sp-pulse 2.5s infinite ease-in-out;
    }
    .sp-logo-img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    .sp-brand-name {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1.5px;
      color: #ffffff;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .sp-brand-sub {
      font-size: 13px;
      color: #94a3b8;
      margin-bottom: 30px;
      letter-spacing: 0.5px;
    }
    .sp-spinner-ring {
      position: relative;
      width: 42px;
      height: 42px;
      margin-bottom: 18px;
    }
    .sp-spinner-ring div {
      box-sizing: border-box;
      display: block;
      position: absolute;
      width: 38px;
      height: 38px;
      margin: 2px;
      border: 3px solid #38bdf8;
      border-radius: 50%;
      animation: sp-spin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      border-color: #38bdf8 transparent transparent transparent;
    }
    .sp-spinner-ring div:nth-child(1) { animation-delay: -0.3s; }
    .sp-spinner-ring div:nth-child(2) { animation-delay: -0.2s; }
    .sp-spinner-ring div:nth-child(3) { animation-delay: -0.1s; }
    .sp-status-text {
      font-size: 12px;
      color: #64748b;
      letter-spacing: 0.8px;
      animation: sp-pulse-text 1.8s infinite ease-in-out;
    }
    @keyframes sp-spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes sp-pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 20px rgba(17, 65, 107, 0.4); }
      50% { transform: scale(1.04); box-shadow: 0 0 30px rgba(56, 189, 248, 0.5); }
    }
    @keyframes sp-pulse-text {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="sp-preloader">
    <div class="sp-loader-card">
      <div class="sp-logo-wrap">
        <img class="sp-logo-img" src="assets/images/sp_logo.png" alt="SP Logo" onerror="this.src='favicon.png'">
      </div>
      <div class="sp-brand-name">SPRESEARCHVIA</div>
      <div class="sp-brand-sub">Research & Financial Advisory Systems</div>
      <div class="sp-spinner-ring">
        <div></div><div></div><div></div><div></div>
      </div>
      <div class="sp-status-text">Starting Secure Session...</div>
    </div>
  </div>

  <script>
    (function () {
      function dismissPreloader() {
        var loader = document.getElementById('sp-preloader');
        if (loader && !loader.classList.contains('fade-out')) {
          loader.classList.add('fade-out');
          setTimeout(function () {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 450);
        }
      }

      // Listen for Flutter's first paint event
      window.addEventListener('flutter-first-frame', dismissPreloader);

      // Backup check if flutter view elements appear in DOM
      var observer = new MutationObserver(function (mutations, obs) {
        var flutterView = document.querySelector('flutter-view, flt-glass-pane');
        if (flutterView) {
          setTimeout(dismissPreloader, 100);
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      // Safety fallback timeout
      setTimeout(dismissPreloader, 12000);
    })();
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
