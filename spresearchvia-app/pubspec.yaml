name: spresearchvia
description: "SP ResearchVia"

publish_to: "none"

version: 2.7.1+3

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.7.3
  dio: ^5.4.0
  get_storage: ^2.1.1
  file_picker: ^10.3.8
  image_picker: ^1.1.2
  path: ^1.9.0
  path_provider: ^2.1.5
  http: ^1.2.2
  intl: ^0.19.0
  razorpay_flutter: ^1.4.0
  otp_autofill: ^4.1.0
  hugeicons: ^1.1.4
  flutter_secure_storage: ^10.0.0
  url_launcher: ^6.3.1
  firebase_core: ^3.4.0
  firebase_messaging: ^15.0.0
  flutter_local_notifications: ^17.2.1
  kyc_workflow: ^2.0.16
  permission_handler: ^12.0.1
  webview_flutter: ^4.13.1
  camera: ^0.11.3
  marquee: ^2.3.0
  syncfusion_flutter_pdfviewer: ^32.1.23
  uuid: ^4.5.2
  device_info_plus: ^12.3.0
  shared_preferences: ^2.3.2
  youtube_player_flutter: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/sp_app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/Poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 700
